[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gyst-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "aiosqlite>=0.20",
    "pillow>=10.0",
    "playwright>=1.44",
    "tomllib>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
recs = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",           # async test client
    "anyio[trio]",
]

[tool.hatch.build.targets.wheel]
packages = ["gyst"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
